name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check formatting with ktlint
        run: ./gradlew spotlessCheck

      - name: Android Lint
        run: ./gradlew :app:lintDebug

      - name: Unit, Robolectric and Compose UI tests with coverage
        run: ./gradlew test koverVerifyCoverage koverXmlReportCoverage koverLogCoverage

      - name: Build debug and minified release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Upload the debug APK
        uses: actions/upload-artifact@v7
        with:
          name: lector-qr-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports
            core/build/reports
          retention-days: 7
